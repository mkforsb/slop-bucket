<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Purrfect Pals — Caring for your pet cat</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐱</text></svg>">
<style>:root {
  --pink: #ff7aa2;
  --pink-d: #e0557f;
  --ink: #4a3444;
  --card: rgba(255, 252, 248, 0.92);
  --shadow: 0 6px 18px rgba(120, 70, 90, 0.18), 0 2px 0 rgba(120, 70, 90, 0.08);
  --font: ui-rounded, "SF Pro Rounded", "Varela Round", "Nunito", "Quicksand", system-ui, -apple-system, "Segoe UI", sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; background: #f7e3d3; font-family: var(--font); color: var(--ink); user-select: none; -webkit-user-select: none; }
canvas { display: block; touch-action: none; outline: none; }
#app { position: fixed; inset: 0; }
.hidden { display: none !important; }
button { font-family: inherit; color: inherit; cursor: pointer; border: none; }

.card { background: var(--card); border-radius: 22px; box-shadow: var(--shadow); backdrop-filter: blur(6px); }

/* ---- HUD */
#catcard { position: absolute; left: 14px; top: 14px; display: flex; gap: 12px; align-items: center; padding: 10px 16px 10px 12px; min-width: 250px; }
#mood { font-size: 40px; line-height: 1; filter: drop-shadow(0 2px 2px rgba(0,0,0,.12)); transition: transform .3s; }
#mood.bump { transform: scale(1.25) rotate(-8deg); }
#catname { font-weight: 900; font-size: 19px; margin-bottom: 4px; letter-spacing: .2px; }
.bar { display: flex; align-items: center; gap: 7px; font-size: 13px; margin: 3px 0; }
.bar .ico { width: 18px; text-align: center; }
.bar .track { flex: 1; height: 10px; border-radius: 6px; background: #f0e2e6; overflow: hidden; min-width: 150px; box-shadow: inset 0 1px 2px rgba(0,0,0,.08); }
.bar .fill { height: 100%; border-radius: 6px; transition: width .4s, background .4s; }
.bar.low .ico { animation: wobble .6s infinite; }
@keyframes wobble { 0%,100% { transform: rotate(-12deg); } 50% { transform: rotate(12deg) scale(1.2); } }

#topright { position: absolute; right: 14px; top: 14px; display: flex; gap: 8px; }
.icon-btn { width: 46px; height: 46px; border-radius: 50%; background: var(--card); box-shadow: var(--shadow); font-size: 20px; transition: transform .15s; }
.icon-btn:hover { transform: scale(1.1); }

#nav { position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); display: flex; gap: 8px; padding: 8px; background: var(--card); border-radius: 26px; box-shadow: var(--shadow); }
#nav button { display: flex; flex-direction: column; align-items: center; gap: 1px; padding: 6px 14px 5px; border-radius: 18px; background: transparent; font-weight: 800; font-size: 12px; transition: transform .15s, background .2s; min-width: 64px; }
#nav button span { font-size: 24px; line-height: 1.1; }
#nav button:hover { background: #ffe6ee; transform: translateY(-3px); }
#nav button.active { background: var(--pink); color: white; box-shadow: 0 3px 0 var(--pink-d); }
#nav button.alert span { animation: wobble .7s infinite; }

/* ---- scene tools (bottom, above nav) */
#tools { position: absolute; left: 50%; bottom: 104px; transform: translateX(-50%); display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; max-width: 92vw; }
.tool { background: var(--card); box-shadow: var(--shadow); border-radius: 18px; padding: 8px 14px; font-weight: 800; font-size: 14px; display: flex; align-items: center; gap: 6px; transition: transform .15s, background .2s; }
.tool:hover { transform: translateY(-2px) scale(1.04); }
.tool.active { background: #fff0c2; box-shadow: 0 0 0 3px #ffc94d, var(--shadow); }
.tool .e { font-size: 20px; }
.tool:disabled { opacity: .45; cursor: default; transform: none; }

#hint { position: absolute; left: 50%; top: 18px; transform: translateX(-50%); background: rgba(74, 52, 68, 0.78); color: white; padding: 8px 18px; border-radius: 20px; font-weight: 700; font-size: 14px; pointer-events: none; transition: opacity .3s; max-width: 60vw; text-align: center; }
#hint:empty { opacity: 0; }

#toasts { position: absolute; left: 50%; top: 64px; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 6px; pointer-events: none; }
.toast { background: white; padding: 8px 16px; border-radius: 16px; font-weight: 800; box-shadow: var(--shadow); animation: toastIn .35s cubic-bezier(.3,1.6,.5,1), toastOut .4s ease-in forwards; animation-delay: 0s, var(--life, 2.2s); font-size: 15px; }
.toast.good { background: #e7f9ec; color: #1f7a3d; }
.toast.bad { background: #ffe8e8; color: #b42318; }
.toast.info { background: #eef4ff; color: #2f4d8f; }
@keyframes toastIn { from { transform: scale(.4) translateY(-10px); opacity: 0; } }
@keyframes toastOut { to { transform: translateY(-14px); opacity: 0; } }

#bubble { position: absolute; transform: translate(-50%, -100%); background: white; border-radius: 50%; width: 54px; height: 54px; display: flex; align-items: center; justify-content: center; font-size: 28px; box-shadow: var(--shadow); pointer-events: none; animation: bob 1.4s ease-in-out infinite; }
#bubble::after { content: ''; position: absolute; left: 12px; bottom: -8px; width: 12px; height: 12px; background: white; border-radius: 50%; }
#bubble::before { content: ''; position: absolute; left: 4px; bottom: -18px; width: 7px; height: 7px; background: white; border-radius: 50%; }
@keyframes bob { 50% { margin-top: -6px; } }

/* ---- side panel (adoption) */
#side { position: absolute; right: 16px; top: 16px; bottom: 16px; width: 380px; display: flex; flex-direction: column; padding: 16px 18px; overflow: hidden; }
#side h2 { margin: 0 0 2px; font-size: 24px; font-weight: 900; }
#side .lead { margin: 0 0 10px; font-size: 13px; opacity: .75; }
.tabs { display: flex; gap: 4px; margin-bottom: 10px; flex-wrap: wrap; }
.tabs button { flex: 1; padding: 7px 4px; border-radius: 12px; background: #f6ebee; font-weight: 800; font-size: 12.5px; }
.tabs button.active { background: var(--pink); color: white; }
.tabbody { flex: 1; overflow-y: auto; padding-right: 4px; }
.row { margin: 10px 0 12px; }
.row > label { display: block; font-weight: 800; font-size: 13px; margin-bottom: 6px; }
.row > label small { font-weight: 600; opacity: .6; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { padding: 6px 11px; border-radius: 14px; background: #f6ebee; font-weight: 700; font-size: 13px; transition: transform .1s; }
.chip:hover { transform: scale(1.06); }
.chip.active { background: var(--pink); color: white; box-shadow: 0 2px 0 var(--pink-d); }
.swatches { display: flex; flex-wrap: wrap; gap: 7px; align-items: center; }
.sw { width: 30px; height: 30px; border-radius: 50%; box-shadow: inset 0 0 0 2px rgba(0,0,0,.08), 0 2px 3px rgba(0,0,0,.12); transition: transform .12s; }
.sw:hover { transform: scale(1.15); }
.sw.active { box-shadow: 0 0 0 3px white, 0 0 0 5px var(--pink); }
.sw.custom { position: relative; overflow: hidden; background: conic-gradient(red, yellow, lime, cyan, blue, magenta, red); }
.sw.custom input { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%; }
input[type=range] { width: 100%; accent-color: var(--pink); }
.slider-row { display: flex; align-items: center; gap: 8px; }
.slider-row span { font-size: 12px; opacity: .6; width: 54px; }
.slider-row span:last-child { text-align: right; }
.name-row { display: flex; gap: 6px; margin: 4px 0 10px; }
.name-row input { flex: 1; font: inherit; font-weight: 800; font-size: 18px; padding: 8px 12px; border-radius: 14px; border: 2px solid #f0d5dd; background: white; color: var(--ink); outline: none; min-width: 0; }
.name-row input:focus { border-color: var(--pink); }
.name-row button, .small-btn { padding: 8px 12px; border-radius: 14px; background: #f6ebee; font-weight: 800; font-size: 14px; }
.toggle { display: inline-flex; align-items: center; gap: 8px; font-weight: 700; font-size: 13px; cursor: pointer; }
.toggle input { width: 18px; height: 18px; accent-color: var(--pink); }
.side-foot { display: flex; gap: 8px; padding-top: 10px; border-top: 2px dashed #f0d5dd; margin-top: 8px; }
button.big { padding: 12px 20px; border-radius: 18px; font-weight: 900; font-size: 17px; background: #f6ebee; box-shadow: 0 3px 0 #e6d0d8; transition: transform .12s; }
button.big:hover { transform: translateY(-2px); }
button.big:active { transform: translateY(1px); box-shadow: none; }
button.primary { background: var(--pink); color: white; box-shadow: 0 4px 0 var(--pink-d); }
button.danger { background: #ffe1e1; color: #b42318; box-shadow: 0 3px 0 #f3c2c2; }
.side-foot .primary { flex: 1; }

/* ---- modals */
.modal { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(255, 226, 234, 0.35); backdrop-filter: blur(3px); }
.modal-card { padding: 22px 26px; min-width: 320px; display: flex; flex-direction: column; gap: 10px; }
.modal-card h2 { margin: 0; }
#stats { font-size: 14px; line-height: 1.7; }
#title { background: radial-gradient(circle at 50% 40%, rgba(255,240,245,.55), rgba(255,200,220,.55)); }
.title-card { text-align: center; padding: 34px 50px; background: var(--card); border-radius: 36px; box-shadow: var(--shadow); animation: pop .6s cubic-bezier(.3,1.6,.5,1); }
@keyframes pop { from { transform: scale(.6); opacity: 0; } }
.title-card h1 { font-size: 58px; margin: 6px 0 0; font-weight: 900; color: var(--pink); text-shadow: 0 4px 0 #ffd3e0; letter-spacing: 1px; }
.title-card .sub { margin: 0 0 22px; font-weight: 800; font-size: 18px; opacity: .75; }
.title-card .paws { font-size: 26px; letter-spacing: 8px; }
.title-card .tiny { font-size: 12px; opacity: .6; margin: 16px 0 0; }
#title-buttons { display: flex; gap: 10px; justify-content: center; }

#wipe { position: absolute; inset: 0; background: #ffd1e0; pointer-events: none; clip-path: circle(0% at 50% 50%); transition: clip-path .38s ease-in-out; z-index: 50; }
#wipe.on { clip-path: circle(75% at 50% 50%); pointer-events: all; }
#loading { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 24px; background: #ffe4ec; z-index: 60; }

@media (max-width: 760px) {
  #side { left: 8px; right: 8px; top: auto; height: 52vh; width: auto; bottom: 8px; }
  #catcard { min-width: 0; padding: 8px 12px 8px 10px; gap: 8px; left: 8px; top: 8px; }
  #mood { font-size: 30px; }
  #catname { font-size: 16px; }
  .bar .track { min-width: 80px; }
  #topright { right: 8px; top: 8px; gap: 6px; }
  .icon-btn { width: 40px; height: 40px; font-size: 17px; }
  #hint { top: 150px; font-size: 12.5px; max-width: 88vw; }
  #toasts { top: 200px; }
  #tools { bottom: 92px; }
  #nav button { min-width: 50px; padding: 5px 8px; }
  .title-card h1 { font-size: 40px; }
}
</style>
</head>
<body>
<div id="app">
  <div id="hud" class="hidden">
    <div id="catcard" class="card">
      <div id="mood" title="Mood">😺</div>
      <div class="cc-body">
        <div id="catname">Mochi</div>
        <div id="bars"></div>
      </div>
    </div>
    <div id="topright">
      <button id="btn-mute" class="icon-btn" title="Sound on/off">🔊</button>
      <button id="btn-edit" class="icon-btn" title="Cat salon: change look &amp; voice">✂️</button>
      <button id="btn-menu" class="icon-btn" title="Menu">☰</button>
    </div>
    <nav id="nav">
      <button data-scene="hub"><span>🏠</span>Home</button>
      <button data-scene="feed"><span>🍽️</span>Feed</button>
      <button data-scene="pet"><span>✋</span>Pet</button>
      <button data-scene="play"><span>🧶</span>Play</button>
      <button data-scene="litter"><span>🧹</span>Litter</button>
    </nav>
  </div>
  <div id="tools"></div>
  <div id="side" class="hidden"></div>
  <div id="hint"></div>
  <div id="toasts"></div>
  <div id="bubble" class="hidden"></div>
  <div id="menu" class="modal hidden">
    <div class="card modal-card">
      <h2>Menu</h2>
      <div id="stats"></div>
      <button class="big" id="menu-close">Back to kitty</button>
      <button class="big danger" id="menu-reset">Adopt a new cat (reset)</button>
    </div>
  </div>
  <div id="title" class="modal">
    <div class="title-card">
      <div class="paws">🐾 🐾 🐾</div>
      <h1>Purrfect Pals</h1>
      <p class="sub">Caring for your pet cat</p>
      <div id="title-buttons">
        <button class="big primary" id="btn-start">Adopt a cat</button>
      </div>
      <p class="tiny">Sound on for meows &amp; purrs 🔊</p>
    </div>
  </div>
  <div id="wipe"></div>
  <div id="loading">Loading kitties…</div>
</div>
